name: convention_app
description: "Offline inventory & convention selling app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.3
  path: ^1.9.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  go_router: ^14.3.0
  provider: ^6.1.2
  intl: ^0.20.0
  share_plus: ^10.0.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
